<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>التطبيق</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @font-face { font-family: 'thmanyah sans'; src: url('https://itsafwa.github.io/landingpage/assets/fonts/thmanyahsans-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'thmanyah sans'; src: url('https://itsafwa.github.io/landingpage/assets/fonts/thmanyahsans-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'thmanyah sans'; src: url('https://itsafwa.github.io/landingpage/assets/fonts/thmanyahsans-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #16171f);
      --hint: var(--tg-theme-hint-color, #7a7e90);
      --secondary: var(--tg-theme-secondary-bg-color, #f4f5f9);
      --brand: #1a1b35;
      --brand-deep: #111224;
      --brand-soft: #2a2d4f;
      --accent: #d4af37;
      --accent-dark: #80611b;
      --line: rgba(127,127,127,.22);
      --ok: #177245; --warn: #8a6d1a; --bad: #b3352c; --info: #2b5cb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "thmanyah sans", system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 0 1rem 6rem; }
    /* Brand band */
    #brandbar { margin: 0 -1rem 1rem; padding: 1.05rem 1.15rem 1.15rem; color: #fff;
      background: linear-gradient(150deg, var(--brand) 55%, var(--brand-deep));
      border-radius: 0 0 1.5rem 1.5rem; box-shadow: 0 6px 22px rgba(10,11,25,.25); }
    .brand-row { display: flex; align-items: center; gap: .8rem; }
    #brand-logo { width: 3.1rem; height: 3.1rem; flex-shrink: 0; border-radius: 1rem; overflow: hidden;
      background: rgba(255,255,255,.09); border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1.45rem; }
    #brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    #brand-name { font-size: 1.22rem; font-weight: 700; line-height: 1.3; }
    #title { font-size: .88rem; font-weight: 500; margin: .1rem 0 0; opacity: .78; }
    #user { margin-top: .85rem; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      border-radius: 1rem; padding: .65rem .9rem; }
    #user .name { font-weight: 700; font-size: 1rem; }
    #user .meta { color: rgba(255,255,255,.75); font-size: .85rem; margin-top: .15rem; }
    #status { color: var(--hint); min-height: 1.2em; margin: .2rem 0 .6rem; }
    #status[data-err="1"] { color: var(--bad); font-weight: 600; }
    h1 { font-size: 1.15rem; margin: 0 0 .35rem; }
    h2 { font-size: 1.04rem; margin: 1.25rem 0 .55rem; padding-right: .6rem; border-right: 3.5px solid var(--accent); line-height: 1.5; }
    .hint, .meta { color: var(--hint); }
    .meta, .reason { font-size: .9rem; margin-top: .2rem; }
    .reason { color: var(--warn); }
    [hidden] { display: none !important; }
    .card { background: var(--secondary); border: 1px solid var(--line); border-radius: 1.1rem;
      padding: .9rem 1.05rem; margin: .65rem 0; box-shadow: 0 1px 5px rgba(15,16,35,.05); }
    .name { font-weight: 700; }
    .ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }
    .act { display: flex; justify-content: space-between; gap: .5rem; align-items: center; padding: .5rem 0; border-bottom: 1px dashed var(--line); }
    .act:last-child { border-bottom: 0; }
    .badge { font-size: .74rem; font-weight: 700; white-space: nowrap; border-radius: 999px; padding: .18rem .6rem; background: rgba(127,127,127,.14); }
    .badge.open, .badge.approved { background: rgba(23,114,69,.14); color: var(--ok); }
    .badge.paused, .badge.pending, .badge.reviewed { background: rgba(212,175,55,.18); color: var(--warn); }
    .badge.submitted { background: rgba(43,92,184,.13); color: var(--info); }
    .badge.rejected { background: rgba(179,53,44,.12); color: var(--bad); }
    button, .btn {
      display: inline-block; border: 0; border-radius: 999px; padding: .6rem 1.15rem; margin: .2rem .15rem 0 0;
      background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
      box-shadow: 0 2px 8px rgba(15,16,35,.16); transition: transform .08s ease, opacity .15s ease; }
    button:active, .btn:active { transform: scale(.97); }
    button.secondary { background: transparent; color: var(--accent-dark); box-shadow: none; padding-right: .4rem; padding-left: .4rem; }
    button.danger { background: var(--bad); color: #fff; }
    input, textarea, select {
      width: 100%; font: inherit; padding: .6rem .7rem; margin: .3rem 0; border-radius: .7rem;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    input[type="checkbox"] { width: auto; }
    label { display: block; font-size: .88rem; color: var(--hint); margin-top: .45rem; }
    textarea { min-height: 6rem; resize: vertical; }
    pre { white-space: pre-wrap; font: inherit; margin: 0; }
    .wird { background: linear-gradient(140deg, var(--brand), var(--brand-soft)); color: #fff; border: 0; }
    .wird .meta { color: rgba(255,255,255,.72); }
    .wird a, a { color: var(--accent-dark); }
    .wird a { color: var(--accent); }
    .sub-actions { margin-top: .5rem; display: flex; flex-wrap: wrap; gap: .3rem; }
    .filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
    .filters button, button.chip { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; padding: .35rem .75rem; font-weight: 500; }
    .filters button.active, button.chip.active { background: var(--brand); color: #fff; border-color: transparent; font-weight: 700; }
    .text { white-space: pre-wrap; margin-top: .35rem; background: rgba(127,127,127,.08); border-radius: .8rem; padding: .7rem .85rem; }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: var(--secondary); border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; padding: .35rem .25rem calc(.35rem + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 18px rgba(15,16,35,.07); }
    nav button { background: transparent; color: var(--hint); box-shadow: none; flex: 1; margin: 0;
      padding: .3rem 0 .2rem; font-size: .72rem; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: .22rem; border-radius: .7rem; }
    nav button i { font-size: 1.22rem; }
    nav button.active { color: var(--brand); font-weight: 700; }
    nav button.active i { color: var(--accent-dark); }
  .skel{position:relative;overflow:hidden;background:var(--secondary);border-radius:1rem;}.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,127,127,.16),transparent);animation:skel-shimmer 1.2s infinite;}@keyframes skel-shimmer{from{transform:translateX(100%);}to{transform:translateX(-100%);}}#skel .skel-title{height:1.4rem;width:55%;margin:.6rem 0;}#skel .skel-line{height:1rem;margin:.6rem 0;}#skel .skel-card{height:5.5rem;margin:.6rem 0;}</style>
</head>
<body>
  <main>
    <header id="brandbar">
      <div class="brand-row">
        <div id="brand-logo"><i class="fa-solid fa-feather-pointed"></i></div>
        <div>
          <div id="brand-name">مبادرة صفوة</div>
          <h1 id="title">التطبيق</h1>
        </div>
      </div>
      <section id="user" hidden>
        <div class="name" id="user-name"></div>
        <div class="meta" id="user-role"></div>
        <div class="meta ltr" id="user-email"></div>
      </section>
    </header>
    <p id="status">جارٍ التحميل…</p><div id="skel" hidden><div class="skel skel-title"></div><div class="skel skel-line"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div>
    <section id="view-home"></section>
    <section id="view-submit" hidden></section>
    <section id="view-subs" hidden></section>
    <section id="view-grades" hidden></section>
    <section id="view-more" hidden></section>
    <section id="view-review" hidden></section>
    <section id="view-acts" hidden></section>
    <section id="view-qaadmin" hidden></section>
    <section id="view-plist" hidden></section>
    <section id="view-pdetail" hidden></section>
    <section id="view-pnew" hidden></section>
  </main>
  <nav id="nav" hidden>
    <button data-tab="home" class="active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
    <button data-tab="submit"><i class="fa-solid fa-paper-plane"></i><span>تسليم</span></button>
    <button data-tab="subs"><i class="fa-solid fa-folder-open"></i><span>تسليماتي</span></button>
    <button data-tab="grades"><i class="fa-solid fa-award"></i><span>درجاتي</span></button>
    <button data-tab="more"><i class="fa-solid fa-ellipsis"></i><span>المزيد</span></button>
  </nav>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var params = new URLSearchParams(location.search);
      var tid = params.get('t') || '';
      var isPlatform = params.get('r') === 'platform';
      var role = isPlatform ? 'platform' : (params.get('r') === 'admin' ? 'admin' : 'student');
      var plat = { q: '', detail: null, license: '' };
      var cacheKey = 'miniapp:bootstrap:' + tid + ':' + role;
      function readInitData() {
        if (tg && tg.initData) return tg.initData;
        function pick(s) {
          try { return (new URLSearchParams(s).get('tgWebAppData') || '').trim(); } catch (e) { return ''; }
        }
        return pick((location.hash || '').replace(/^#/, '')) || pick(location.search.slice(1)) || '';
      }
      var initData = readInitData();
      var data = null, tab = 'home', sel = { pid: '', activity: '', level: '' };
      var admin = { pid: '', filter: 'all', q: '', review: null, qa: null, settings: null, schedule: null, report: '', summary: '' };
      var statusEl = document.getElementById('status');

      function setStatus(t, err) {
        statusEl.textContent = t || '';
        statusEl.setAttribute('data-err', err ? '1' : '0');
        statusEl.hidden = !t;
      }

      function isAdmin() { return data && data.user && (data.user.role === 'admin' || data.user.role === 'owner'); }
      function pidOf() { return admin.pid || (data && data.programs && data.programs[0] && data.programs[0].id) || ''; }
      function esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      function pidSelectHtml() {
        var list = (data && data.programs) || [];
        if (!list.length) return '<p class="hint">لا برامج في نطاقك.</p>';
        return '<label>البرنامج</label><select id="admin-pid">' + list.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (p.id === pidOf() ? ' selected' : '') + '>' + esc(p.name || p.id) + (p.open ? ' 🟢' : ' ⚪️') + '</option>';
        }).join('') + '</select>';
      }
      function bindPid(el) {
        var selEl = el.querySelector('#admin-pid');
        if (!selEl) return;
        selEl.onchange = function () { admin.pid = selEl.value; admin.review = admin.qa = admin.settings = admin.schedule = null; admin.summary = admin.report = ''; renderAll(); loadTab(tab); };
      }
      function runAdmin(action, body, msg) {
        setStatus(msg || 'جارٍ التنفيذ…');
        return api(action, body).then(function (r) {
          if (!r || !r.ok) { setStatus((r && (r.message || r.error)) || 'تعذر التنفيذ.', true); return r; }
          setStatus(r.message || '');
          return r;
        }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
      }
      function apiUrl() {
        var base = (window.MINIAPP_API || '').replace(/\/+$/, '');
        if (!base) return '';
        if (isPlatform) return base + '?b=app&r=platform';
        return base + '?b=app&t=' + encodeURIComponent(tid) + '&r=' + encodeURIComponent(role);
      }
      function api(action, extra) {
        return fetch(apiUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(Object.assign({ initData: initData, action: action }, extra || {}))
        }).then(function (r) { return r.text(); }).then(JSON.parse);
      }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
      function sanitizeWird(html) {
        return String(html || '')
          .replace(/<(?!\/?a\b)[^>]*>/gi, '')
          .replace(/<a\s+[^>]*>/gi, function (tag) {
            var m = tag.match(/href\s*=\s*"([^"]*)"/i) || tag.match(/href\s*=\s*'([^']*)'/i);
            var url = m && /^https?:\/\//i.test(m[1]) ? m[1] : '';
            return url ? '<a href="' + url.replace(/"/g, '') + '" target="_blank" rel="noopener">' : '';
          })
          .replace(/\n/g, '<br>');
      }
      function progById(id) { return (data.programs || []).find(function (p) { return p.id === id; }); }
      function firstProg() { return (data.programs || []).filter(function (p) { return p.open; })[0] || (data.programs || [])[0]; }

      function renderUser() {
        if (!data || !data.user) return;
        document.getElementById('user-name').textContent = data.user.name || '';
        document.getElementById('user-role').textContent = (data.tenant && data.tenant.name ? data.tenant.name + ' — ' : '') + (data.user.roleLabel || data.user.role || '');
        document.getElementById('user-email').textContent = data.email || '';
        document.getElementById('user').hidden = false;
        document.getElementById('title').textContent = (data.tenant && data.tenant.name) || 'التطبيق';
      }
      function regLink(p) {
        if (p.registered || !p.regFormUrl) return '';
        return '<p class="meta">لست مسجّلًا في هذا البرنامج. <a class="btn" href="' + esc(p.regFormUrl) + '" target="_blank" rel="noopener">📝 التسجيل في البرنامج</a></p>';
      }
      function emailBox() {
        return '<div class="card"><label>البريد الذي سجلت به</label>' +
          '<input id="email-input" class="ltr" type="email" value="' + esc(data.email || '') + '" placeholder="name@gmail.com">' +
          '<button type="button" id="email-save">حفظ البريد</button></div>';
      }
      function actLine(p, a) {
        return '<div class="act"><span>' + esc(a.title) + (a.level ? ' <span class="meta">(' + esc(a.level) + ')</span>' : '') +
          '</span><span class="badge ' + esc(a.status) + '">' + esc(a.statusLabel) + '</span></div>' +
          (a.reason ? '<div class="reason">' + esc(a.reason) + '</div>' : '');
      }
      function renderHome() {
        var el = document.getElementById('view-home');
        var html = emailBox();
        (data.programs || []).forEach(function (p) {
          html += '<div class="card"><div class="name">' + esc(p.name) + (p.open ? '' : ' — مغلق') + '</div>';
          html += regLink(p);
          if (p.levels && p.levels.length) html += '<div class="meta">المستويات: ' + esc(p.levels.join('، ')) + '</div>';
          (p.activities || []).forEach(function (a) { html += actLine(p, a); });
          if (p.subsCount) html += '<div class="meta">تسليماتك: ' + p.subsCount + '</div>';
          html += '</div>';
        });
        if (!(data.programs || []).length) html += '<p class="hint">لا توجد برامج ظاهرة الآن.</p>';
        el.innerHTML = html;
        bindEmail();
      }
      function bindEmail() {
        var btn = document.getElementById('email-save');
        if (!btn) return;
        btn.onclick = function () {
          setStatus('جارٍ التحقق…');
          api('setEmail', { email: document.getElementById('email-input').value, pid: sel.pid || (firstProg() && firstProg().id) || '' })
            .then(function (r) {
              if (!r.ok) { setStatus(r.message || r.error, true); return refresh(); }
              setStatus('حُفظ البريد.');
              return refresh();
            }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
        };
      }
      function fillSelects() {
        var p = progById(sel.pid) || firstProg();
        if (!p) return;
        sel.pid = p.id;
        var acts = (p.activities || []).filter(function (a) { return !sel.level || !a.level || a.level === sel.level; });
        if (sel.activity && !acts.some(function (a) { return a.key === sel.activity; })) sel.activity = '';
        if (!sel.activity && acts[0]) sel.activity = acts[0].key;
        var pSel = document.getElementById('sub-pid');
        var lSel = document.getElementById('sub-level');
        var aSel = document.getElementById('sub-act');
        if (pSel) pSel.innerHTML = (data.programs || []).map(function (x) {
          return '<option value="' + esc(x.id) + '"' + (x.id === sel.pid ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('');
        if (lSel) {
          var levels = p.levels || [];
          lSel.parentNode.hidden = !levels.length;
          lSel.innerHTML = levels.map(function (l) {
            return '<option value="' + esc(l) + '"' + (l === sel.level ? ' selected' : '') + '>' + esc(l) + '</option>';
          }).join('');
          if (levels.length && !sel.level) { sel.level = levels[0]; fillSelects(); return; }
        }
        if (aSel) aSel.innerHTML = acts.map(function (a) {
          return '<option value="' + esc(a.key) + '"' + (a.key === sel.activity ? ' selected' : '') + '>' + esc(a.title) + (a.level ? ' (' + esc(a.level) + ')' : '') + ' — ' + esc(a.statusLabel) + '</option>';
        }).join('');
        var act = acts.find(function (a) { return a.key === sel.activity; });
        var hint = document.getElementById('sub-hint');
        var textBox = document.getElementById('sub-text-wrap');
        var fileBtn = document.getElementById('sub-file');
        if (hint) hint.textContent = (act && act.instructions) || (act && act.reason) || '';
        if (textBox) textBox.hidden = !!(act && act.accepts === 'file');
        if (fileBtn) fileBtn.hidden = !!(act && act.accepts === 'text');
        var hold = document.getElementById('sub-reg');
        if (hold) hold.innerHTML = p ? regLink(p) : '';
      }
      function renderSubmit() {
        var el = document.getElementById('view-submit');
        if (!(data.programs || []).length) { el.innerHTML = '<p class="hint">لا توجد برامج للتسليم.</p>'; return; }
        el.innerHTML = emailBox() + '<div class="card" id="sub-reg"></div><div class="card">' +
          '<label>البرنامج</label><select id="sub-pid"></select>' +
          '<div><label>المستوى</label><select id="sub-level"></select></div>' +
          '<label>الفعالية</label><select id="sub-act"></select>' +
          '<p class="hint" id="sub-hint"></p>' +
          '<div id="sub-text-wrap"><label>نص المشاركة</label><textarea id="sub-text"></textarea>' +
          '<button type="button" id="sub-send">إرسال النص</button></div>' +
          '<button type="button" id="sub-file">إرسال صورة أو ملف في المحادثة</button></div>';
        bindEmail();
        fillSelects();
        document.getElementById('sub-pid').onchange = function () { sel.pid = this.value; sel.activity = ''; sel.level = ''; fillSelects(); };
        document.getElementById('sub-level').onchange = function () { sel.level = this.value; sel.activity = ''; fillSelects(); };
        document.getElementById('sub-act').onchange = function () { sel.activity = this.value; fillSelects(); };
        document.getElementById('sub-send').onclick = function () {
          setStatus('جارٍ الإرسال…');
          api('submitText', { pid: sel.pid, activity: sel.activity, level: sel.level, text: document.getElementById('sub-text').value,
            nonce: Date.now().toString(36) + Math.random().toString(36).slice(2) })
            .then(function (r) {
              if (!r.ok) { setStatus(r.message || r.error, true); return; }
              setStatus(r.confirmation || 'تم الاستلام.');
              document.getElementById('sub-text').value = '';
              return refresh();
            }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
        };
        document.getElementById('sub-file').onclick = function () {
          setStatus('جارٍ التجهيز…');
          api('startFile', { pid: sel.pid, activity: sel.activity, level: sel.level })
            .then(function (r) {
              if (!r.ok) { setStatus(r.message || r.error, true); return; }
              setStatus(r.message || 'أرسل الملف في المحادثة.');
              if (tg && tg.close) tg.close();
            }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
        };
      }
      function renderSubs() {
        var el = document.getElementById('view-subs');
        var html = '';
        (data.programs || []).forEach(function (p) {
          html += '<h2>' + esc(p.name) + '</h2>';
          if (!p.showSubs) { html += '<p class="hint">عرض التسليمات غير متاح في هذا البرنامج حاليًا.</p>'; return; }
          if (!(p.subs || []).length) { html += '<p class="hint">لا توجد تسليمات مرسلة من حسابك هذا بعد.</p>'; return; }
          p.subs.forEach(function (s) {
            html += '<div class="card" data-pid="' + esc(p.id) + '" data-sub="' + esc(s.id) + '"><div class="name">' + esc(s.act) + (s.level ? ' (' + esc(s.level) + ')' : '') + ' #' + esc(s.n) + '</div>' +
              '<div class="meta">' + esc(s.statusLabel) + (s.time ? ' — ' + esc(s.time) : '') + (s.type ? ' — ' + esc(s.type) : '') + '</div>' +
              (s.text ? '<pre>' + esc(s.text) + '</pre>' : '') +
              (s.hasFile || s.fileName ? '<div class="meta">📎 ' + esc(s.fileName || 'ملف') + '</div>' : '') +
              (s.reason ? '<div class="reason">' + esc(s.reason) + '</div>' : '') +
              (s.editBlock && !s.canEdit ? '<div class="reason">' + esc(s.editBlock) + '</div>' : '') +
              '<div class="sub-actions">' +

            return '<div class="card" data-id="' + esc(s.id) + '"><div class="name">' + esc(s.name) + ' — «' + esc(s.act) + '» #' + esc(s.n) + '</div>' +
              '<div class="meta">' + esc(s.email) + ' · ' + esc(s.time) + ' · ' + st + (s.reason ? ' — ' + esc(s.reason) : '') + '</div>' +
              '<div class="text">' + body + '</div>' +
              (s.deleted ? '' : ('<div class="sub-actions">' +
                (s.hasFile ? '<button class="secondary js-file">أرسل الملف في المحادثة</button>' : '') +
                (s.rejected
                  ? '<button class="js-unrej">↩️ تراجع عن الرفض</button>'
                  : '<button class="danger js-rej">❌ رفض</button><textarea class="js-note" placeholder="ملاحظة الرفض (اختياري)"></textarea>') +
                '</div>'));
          }).join('') || '<p class="hint">لا تسليمات في هذا العرض.</p>');
        bindPid(el);
        el.querySelectorAll('.filters button').forEach(function (b) {
          b.onclick = function () { admin.filter = b.getAttribute('data-f'); loadReview(); };
        });
        var q = el.querySelector('#rev-q');
        if (q) q.onchange = function () { admin.q = q.value; loadReview(); };
        el.querySelectorAll('.js-rej').forEach(function (btn) {
          btn.onclick = function () {
            var card = btn.parentNode.parentNode;
            var note = card.querySelector('.js-note');
            runAdmin('reject', { pid: pidOf(), subId: card.getAttribute('data-id'), reason: note && note.value }).then(function (r) { if (r && r.ok) loadReview(); });
          };
        });
        el.querySelectorAll('.js-unrej').forEach(function (btn) {
          btn.onclick = function () {
            runAdmin('unreject', { pid: pidOf(), subId: btn.parentNode.parentNode.getAttribute('data-id') }).then(function (r) { if (r && r.ok) loadReview(); });
          };
        });
        el.querySelectorAll('.js-file').forEach(function (btn) {
          btn.onclick = function () {
            runAdmin('sendFile', { pid: pidOf(), subId: btn.parentNode.parentNode.getAttribute('data-id') }, 'جارٍ إرسال الملف…');
          };
        });
      }
      function loadReview() {
        if (!pidOf()) { admin.review = []; renderReview(); return; }
        setStatus('جارٍ تحميل التسليمات…');
        api('review', { pid: pidOf(), filter: admin.filter, q: admin.q }).then(function (r) {
          if (!r || !r.ok) { setStatus((r && (r.message || r.error)) || 'تعذر التحميل.', true); return; }
          admin.review = r.items || []; setStatus(''); renderReview();
        }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
      }
      function renderActs() {
        var el = document.getElementById('view-acts');
        var p = ((data.programs || []).filter(function (x) { return x.id === pidOf(); })[0]) || { activities: [] };
        el.innerHTML = '<h2>الفعاليات</h2>' + pidSelectHtml() + (p.activities || []).map(function (a) {
          return '<div class="card" data-key="' + esc(a.key) + '"><div class="name">' + esc(a.key) + '</div>' +
            '<div class="meta">' + esc(a.pauseLabel) + (a.points != null ? ' · ' + a.points + ' درجة' : '') + '</div>' +
            (a.paused
              ? '<button class="js-res">▶️ تفعيل الآن</button>'
              : '<button class="js-pz" data-days="1">إيقاف يوم</button><button class="js-pz" data-days="3">3 أيام</button><button class="js-pz" data-days="7">أسبوع</button><button class="js-pz" data-until="inf">حتى إشعار آخر</button>') +
            '</div>';
        }).join('');
        bindPid(el);
        el.querySelectorAll('.js-pz').forEach(function (btn) {
          btn.onclick = function () {
            var body = { pid: pidOf(), activity: btn.parentNode.getAttribute('data-key') };
            if (btn.getAttribute('data-until')) body.until = 'inf'; else body.days = Number(btn.getAttribute('data-days'));
            runAdmin('pause', body).then(function (r) { if (r && r.ok) refresh(); });
          };
        });
        el.querySelectorAll('.js-res').forEach(function (btn) {
          btn.onclick = function () {
            runAdmin('resume', { pid: pidOf(), activity: btn.parentNode.getAttribute('data-key') }).then(function (r) { if (r && r.ok) refresh(); });
          };
        });
      }
      function renderQaAdmin() {
        var el = document.getElementById('view-qaadmin');
        var items = admin.qa || [];
        el.innerHTML = '<h2>الأسئلة المنتظرة' + (data.qaPending ? ' (' + data.qaPending + ')' : '') + '</h2>' + pidSelectHtml() +
          (items.map(function (q) {
            return '<div class="card" data-id="' + esc(q.id) + '"><div class="name">' + esc(q.name) + ' — ' + esc(q.pid) + '</div>' +
              '<div class="text">«' + esc(q.q) + '»</div>' +
              (q.suggested ? '<div class="meta">💡 ' + esc(q.suggested) + '</div>' : '<div class="meta">بلا إجابة مقترحة</div>') +
              '<div class="sub-actions">' +
              (q.suggested ? '<button class="js-sug">✅ إرسال المقترحة</button>' : '') +
              '<button class="danger js-ign">🙈 تجاهل</button>' +
              '<textarea class="js-custom" placeholder="رد مكتوب"></textarea><button class="js-cust">إرسال الرد</button>' +
              '</div></div>';
          }).join('') || '<p class="hint">لا أسئلة بانتظار المراجعة.</p>');
        bindPid(el);
        function after(r) { if (r && r.ok) { loadQa(); refresh(); } }
        el.querySelectorAll('.js-sug').forEach(function (btn) {
          btn.onclick = function () { runAdmin('qaAct', { act: 's', qid: btn.parentNode.parentNode.getAttribute('data-id') }).then(after); };
        });
        el.querySelectorAll('.js-ign').forEach(function (btn) {
          btn.onclick = function () { runAdmin('qaAct', { act: 'i', qid: btn.parentNode.parentNode.getAttribute('data-id') }).then(after); };
        });
        el.querySelectorAll('.js-cust').forEach(function (btn) {
          btn.onclick = function () {
            var card = btn.parentNode.parentNode, t = card.querySelector('.js-custom');
            runAdmin('qaAct', { act: 'c', qid: card.getAttribute('data-id'), text: t && t.value }).then(function (r) {
              if (r && r.ok && t && t.value) {
                if (window.confirm('هل أضيف السؤال والرد إلى الأسئلة الشائعة؟')) runAdmin('qaAct', { act: 'f', qid: card.getAttribute('data-id') }).then(after);
                else after(r);
              }
            });
          };
        });
      }
      function loadQa() {
        setStatus('جارٍ تحميل الأسئلة…');
        api('qaPending', { pid: pidOf() }).then(function (r) {
          if (!r || !r.ok) { setStatus((r && (r.message || r.error)) || 'تعذر التحميل.', true); return; }
          admin.qa = r.items || []; setStatus(''); renderQaAdmin();
        }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
      }
      function renderAdminMore() {
        var el = document.getElementById('view-more');
        var sch = admin.schedule, set = admin.settings;
        var html = '<h2>المزيد</h2>' + pidSelectHtml();
        html += '<div class="card"><div class="name">📅 المواعيد والتذكيرات</div>';
        if (sch) {
          html += '<div class="meta">التذكيرات الآلية: ' + (sch.remindersOn ? '🟢 مفعّلة' : '⚪️ موقوفة') + '</div>' +
            '<button class="js-rem">' + (sch.remindersOn ? '⏹ إيقاف التذكيرات' : '▶️ تفعيل التذكيرات') + '</button>' +
            '<button class="secondary js-prev">👀 معاينة الغد</button>' +
            (sch.items || []).map(function (x) {
              return '<div class="act" data-row="' + x.row + '" data-key="' + esc(x.key) + '"><span>' + esc(x.line) + '</span><button class="secondary js-schdel">حذف</button></div>';
            }).join('') +
            '<label>إضافة موعد</label><select id="sch-key">' + (sch.schedulable || []).map(function (x) {
              return '<option value="' + esc(x.key) + '">' + esc(x.key) + '</option>';
            }).join('') + '</select>' +
            '<label>يبدأ في (اختياري)</label><input id="sch-start" type="datetime-local">' +
            '<label>آخر موعد (اختياري)</label><input id="sch-end" type="datetime-local">' +
            '<button class="js-schadd">➕ إضافة</button>' +
            (admin.preview ? '<pre class="text">' + esc(admin.preview) + '</pre>' : '');
        } else html += '<button class="js-load-sch">عرض المواعيد</button>';
        html += '</div><div class="card"><div class="name">⚙️ الإعدادات</div>';
        if (set && set.sections) {
          html += set.sections.filter(function (sec) { return sec.general; }).map(function (sec) {
            return '<h2>' + esc(sec.title) + '</h2>' + sec.fields.map(function (f) {
              var input = (f.kind === 'choice' || f.kind === 'yesno')
                ? ('<select data-sec="' + esc(sec.id) + '" data-key="' + esc(f.key) + '">' +
                  (f.kind === 'yesno' ? ['نعم','لا'] : (f.choices || [])).map(function (c) {
                    return '<option' + (String(f.value) === String(c) ? ' selected' : '') + '>' + esc(c) + '</option>';
                  }).join('') + '</select>')
                : (f.kind === 'hour'
                  ? ('<input type="time" step="3600" data-kind="hour" data-sec="' + esc(sec.id) + '" data-key="' + esc(f.key) + '" value="' + (f.value === '' || f.value == null ? '' : ('0' + String(parseInt(f.value, 10) || 0)).slice(-2) + ':00') + '">')
                  : (f.kind === 'date'
                    ? ('<input type="date" data-kind="date" data-sec="' + esc(sec.id) + '" data-key="' + esc(f.key) + '" value="' + esc(String(f.value || '').slice(0, 10)) + '">')
                    : ('<input data-sec="' + esc(sec.id) + '" data-key="' + esc(f.key) + '" value="' + esc(f.value) + '">')));
              return '<label>' + esc(f.label) + '</label>' + input + '<button class="secondary js-save-f" data-sec="' + esc(sec.id) + '" data-key="' + esc(f.key) + '">حفظ</button>';
            }).join('');
          }).join('');
        } else html += '<button class="js-load-set">عرض الإعدادات</button>';
        html += '</div>';
        if (data.reportActive || data.canReport) {
          html += '<div class="card"><div class="name">📊 التقرير الشهري</div>' +
            (data.canReport ? '<input id="rep-month" type="month"><button class="js-rep">عرض التقرير</button>' : '<div class="hint">⛔ التقرير للمالك ومن يسمح لهم.</div>') +
            (admin.report ? '<pre class="text">' + esc(admin.report) + '</pre>' : '') + '</div>';
        }
        if (data.owner && data.modules) {
          html += '<div class="card"><div class="name">🧩 الوحدات</div>' + data.modules.map(function (m) {
            var st = m.locked ? '🔒 غير مشمولة' : (!m.ready ? '⏳ قريبًا' : (m.on ? '🟢 مفعّلة' : '⚪️ موقوفة'));
            return '<div class="act"><span>' + esc(m.title) + ' — ' + st + '</span>' +
              (m.ready && !m.locked ? '<button class="js-mod" data-id="' + esc(m.id) + '">' + (m.on ? 'إيقاف' : 'تفعيل') + '</button>' : '') + '</div>';
          }).join('') + '</div>';
        }
        if (data.owner) {
          var ads = data.admins || [];
          html += '<div class="card"><div class="name">👥 المشرفون</div>' + ads.map(function (a) {
            return '<div class="act" data-uid="' + esc(a.id) + '"><span>' + esc(a.name || a.id) + ' — ' + (a.programs && a.programs.length ? esc(a.programs.join('، ')) : 'كل البرامج') + '</span><button class="danger js-adel">حذف</button></div>';
          }).join('') +
            '<input id="adm-id" placeholder="معرّف تيليجرام"><input id="adm-name" placeholder="الاسم">' +
            '<label><input type="checkbox" id="adm-all" checked> كل البرامج</label>' +
            '<div id="adm-progs">' + (data.programs || []).map(function (p) { return '<label><input type="checkbox" class="adm-prog" value="' + esc(p.id) + '"> ' + esc(p.name || p.id) + '</label>'; }).join('') + '</div>' +
            '<button class="js-aadd">➕ إضافة / تحديث</button></div>';
        }
        el.innerHTML = html;
        bindPid(el);
        var loadSch = el.querySelector('.js-load-sch');
        if (loadSch) loadSch.onclick = function () { loadSchedule(); };
        var loadSet = el.querySelector('.js-load-set');
        if (loadSet) loadSet.onclick = function () { loadSettings(); };
        var rem = el.querySelector('.js-rem');
        if (rem) rem.onclick = function () { runAdmin('remindOn', { pid: pidOf(), on: !(sch && sch.remindersOn) }).then(function (r) { if (r && r.ok) loadSchedule(); }); };
        var prev = el.querySelector('.js-prev');
        if (prev) prev.onclick = function () { runAdmin('previewRemind', { pid: pidOf() }, 'جارٍ المعاينة…').then(function (r) { if (r && r.ok) { admin.preview = r.text; renderAdminMore(); } }); };
        var add = el.querySelector('.js-schadd');
        if (add) add.onclick = function () {
          var sV = (el.querySelector('#sch-start') || {}).value, eV = (el.querySelector('#sch-end') || {}).value;
          runAdmin('setSchedule', { pid: pidOf(), kind: 'add', key: (el.querySelector('#sch-key') || {}).value, start: sV || '-', deadline: eV || '-' }).then(function (r) { if (r && r.ok) loadSchedule(); });
        };
        el.querySelectorAll('.js-schdel').forEach(function (btn) {
          btn.onclick = function () {
            var row = btn.parentNode;
            runAdmin('setSchedule', { pid: pidOf(), kind: 'del', row: Number(row.getAttribute('data-row')), key: row.getAttribute('data-key') }).then(function (r) { if (r && r.ok) loadSchedule(); });
          };
        });
        el.querySelectorAll('.js-save-f').forEach(function (btn) {
          btn.onclick = function () {
            var sec = btn.getAttribute('data-sec'), key = btn.getAttribute('data-key');
            var inp = el.querySelector('[data-sec="' + sec + '"][data-key="' + key + '"]');
            var val = inp && inp.value;
            if (inp && inp.getAttribute('data-kind') === 'hour') val = val ? String(parseInt(val.split(':')[0], 10)) : '';
            runAdmin('setSetting', { pid: pidOf(), sec: sec, key: key, value: val });
          };
        });
        var rep = el.querySelector('.js-rep');
        if (rep) rep.onclick = function () {
          var m = el.querySelector('#rep-month');
          runAdmin('report', { pid: pidOf(), month: m && m.value }, 'جارٍ إعداد التقرير…').then(function (r) { if (r && r.ok) { admin.report = r.text; renderAdminMore(); } });
        };
        el.querySelectorAll('.js-mod').forEach(function (btn) {
          btn.onclick = function () { runAdmin('toggleModule', { id: btn.getAttribute('data-id') }).then(function (r) { if (r && r.ok) refresh(); }); };
        });
        el.querySelectorAll('.js-adel').forEach(function (btn) {
          btn.onclick = function () { runAdmin('removeAdmin', { uid: btn.parentNode.getAttribute('data-uid') }).then(function (r) { if (r && r.ok) { if (r.admins) data.admins = r.admins; renderAll(); } }); };
        });
        var aadd = el.querySelector('.js-aadd');
        if (aadd) aadd.onclick = function () {
          var progs = []; el.querySelectorAll('.adm-prog').forEach(function (c) { if (c.checked) progs.push(c.value); });
          runAdmin('addAdmin', { uid: (el.querySelector('#adm-id') || {}).value, name: (el.querySelector('#adm-name') || {}).value, all: !!(el.querySelector('#adm-all') && el.querySelector('#adm-all').checked), programs: progs }).then(function (r) { if (r && r.ok) { if (r.admins) data.admins = r.admins; renderAll(); } });
        };
      }
      function loadSchedule() {
        api('schedule', { pid: pidOf() }).then(function (r) {
          if (!r || !r.ok) { setStatus((r && (r.message || r.error)) || 'تعذر التحميل.', true); return; }
          admin.schedule = r; setStatus(''); renderAdminMore();
        }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
      }
      function loadSettings() {
        api('settings', { pid: pidOf() }).then(function (r) {
          if (!r || !r.ok) { setStatus((r && (r.message || r.error)) || 'تعذر التحميل.', true); return; }
          admin.settings = r; setStatus(''); renderAdminMore();
        }).catch(function () { setStatus('تعذر الاتصال بالخادم.', true); });
      }
      function loadTab(name) {
        if (!isAdmin()) return;
        if (name === 'review') loadReview();
        if (name === 'qaadmin') loadQa();
      }

      function showTab(name) {
        tab = name;
        var allTabs = ['home', 'submit', 'subs', 'grades', 'more', 'review', 'acts', 'qaadmin', 'plist', 'pdetail', 'pnew'];
        allTabs.forEach(function (t) {
          var n = document.getElementById('view-' + t);
          if (n) n.hidden = t !== name;
        });
        setNav();
        if (isPlatform) {
          if (name === 'home') renderPlatformDash();
          if (name === 'plist') renderPlatformList();
          if (name === 'pnew') renderPlatformNew();
          if (name === 'pdetail') renderPlatformDetail();
          return;
        }
        if (isAdmin()) {
          if (name === 'home') renderAdminHome();
          if (name === 'acts') renderActs();
          if (name === 'more') renderAdminMore();
          loadTab(name);
        }
      }
      function renderAll() {
        if (!data || !data.ok) return;
        if (!admin.pid && data.programs && data.programs[0]) admin.pid = data.programs[0].id;
        if (isPlatform) { renderPlatformAll(); return; }
        renderUser();
        setNav();
        if (isAdmin()) {
          document.getElementById('title').textContent = data.user.role === 'owner' ? 'لوحة المالك' : 'لوحة المشرف';
          document.getElementById('user-email').hidden = true;
          if (tab === 'submit' || tab === 'subs' || tab === 'grades') tab = 'home';
          renderAdminHome();
          renderActs();
          renderAdminMore();
          if (admin.review) renderReview();
          if (admin.qa) renderQaAdmin();
          showTab(tab);
          return;
        }
        document.getElementById('title').textContent = 'التطبيق';
        document.getElementById('user-email').hidden = false;
        renderHome();
        renderSubmit();
        renderSubs();
        renderGrades();
        renderMore();
        showTab(tab);
      }
      function shadeHex(hex, f) {
        var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        var t = f < 1 ? 0 : 255, p = Math.abs(f - 1);
        r = Math.round((t - r) * p) + r; g = Math.round((t - g) * p) + g; b = Math.round((t - b) * p) + b;
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }
      function applyTheme() {
        var t = (!isPlatform && data && data.tenant && data.tenant.theme) || {};
        var brand = /^#[0-9a-fA-F]{6}$/.test(t.brand || '') ? t.brand : '#1a1b35';
        var accent = /^#[0-9a-fA-F]{6}$/.test(t.accent || '') ? t.accent : '#d4af37';
        var st = document.documentElement.style;
        st.setProperty('--brand', brand);
        st.setProperty('--brand-deep', shadeHex(brand, 0.7));
        st.setProperty('--brand-soft', shadeHex(brand, 1.25));
        st.setProperty('--accent', accent);
        st.setProperty('--accent-dark', shadeHex(accent, 0.55));
        var nm = document.getElementById('brand-name');
        if (nm) nm.textContent = t.name || (data && data.tenant && data.tenant.name) || 'مبادرة صفوة';
        var lg = document.getElementById('brand-logo');
        if (lg) lg.innerHTML = t.logo ? '<img src="' + esc(t.logo) + '" alt="">' : '<i class="fa-solid fa-feather-pointed"></i>';
        try { if (window.Telegram && Telegram.WebApp && Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor(brand); } catch (e) {}
      }
      function applyData(next, fromCache) { var sk = document.getElementById('skel'); if (sk) sk.hidden = true;
        data = next;
        applyTheme();
        renderAll();
        if (!fromCache) setStatus('');
      }
      function refresh() {
        return api('bootstrap').then(function (r) {
          if (!r || !r.ok) {
            var msg = (r && (r.message || r.error)) || 'تعذر فتح التطبيق.';
            setStatus(msg, true); var sk3 = document.getElementById('skel'); if (sk3) sk3.hidden = true;
            if (isPlatform) {
              document.getElementById('title').textContent = 'لوحة المنصة';
              document.getElementById('nav').hidden = true;
              document.getElementById('view-home').innerHTML = '<div class="card"><div class="name">' + esc(msg) + '</div></div>';
              document.getElementById('view-home').hidden = false;
            }
            return r;
          }
          applyData(r, false);
          try { localStorage.setItem(cacheKey, JSON.stringify(isPlatform ? { ok: true, user: r.user, stats: r.stats, tenants: r.tenants, modules: r.modules } : { ok: true, user: r.user, tenant: r.tenant, email: r.email, programs: r.programs || [], wird: r.wird, qa: r.qa, remindersOff: r.remindersOff, owner: r.owner, canReport: r.canReport, reportActive: r.reportActive, qaActive: r.qaActive, qaPending: r.qaPending, modules: r.modules, admins: r.admins })); } catch (e) {}
          return r;
        });
      }

      document.getElementById('nav').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) showTab(b.getAttribute('data-tab'));
      });

      if (tg) { tg.ready(); tg.expand(); if (tg.onEvent) tg.onEvent('themeChanged', function () {}); }
      try {
        var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && cached.ok) { applyData(cached, true); setStatus('جارٍ التحديث…'); }
      } catch (e) {}
      if (!isPlatform && !tid) { setStatus('رابط غير مكتمل.', true); return; }
      if (!initData) { setStatus('افتح التطبيق من تيليجرام.', true); return; }
      if (!apiUrl()) { setStatus('رابط الخادم غير مضبوط بعد.', true); return; }
      var sk1 = document.getElementById('skel'); if (sk1 && !(cached && cached.ok)) sk1.hidden = false; refresh().catch(function () { var sk2 = document.getElementById('skel'); if (sk2) sk2.hidden = true; setStatus('تعذر الاتصال بالخادم.', true); });
    })();
  </script>
</body>
</html>
